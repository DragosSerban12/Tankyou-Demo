version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: dragosDB
      POSTGRES_USER: dragos
      POSTGRES_PASSWORD: "123"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      restart_policy:
        condition: any

  web:
    image: dragosn1/tankyou:latest
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn TankYou.wsgi:application --bind 0.0.0.0:8000
      "
    environment:
      DJANGO_ENV: production
      POSTGRES_DB: dragosDB
      POSTGRES_USER: dragos
      POSTGRES_PASSWORD: "123"
      POSTGRES_HOST: db
    volumes:
      - static_volume:/code/TankYouProj/staticfiles
      - media_volume:/code/media
    networks:
      - backend
      - frontend
    deploy:
      restart_policy:
        condition: any

  nginx:
    image: nginx:latest
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    secrets:
      - nginx_cert
      - nginx_key
    volumes:
      - static_volume:/code/staticfiles:ro
      - media_volume:/code/media:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    networks:
      - frontend
    deploy:
      restart_policy:
        condition: any

  certbot:
    image: certbot/certbot
    command: >
      certonly
      --webroot
      --webroot-path=/var/www/certbot
      --email dragos703@gmail.com
      --agree-tos
      --no-eff-email
      -d tankyouapp.online
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    deploy:
      replicas: 0
      restart_policy:
        condition: none

volumes:
  postgres_data:
  static_volume:
  media_volume:
  certbot_www:
  certbot_conf:

networks:
  backend:
    external: true
    name: tankyou_backend

  frontend:
    external: true
    name: tankyou_frontend

configs:
  nginx_conf:
    external: true

secrets:
  nginx_cert:
    external: true
  nginx_key:
    external: true
