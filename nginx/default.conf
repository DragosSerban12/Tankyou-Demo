server {
    listen 80;
    server_name tankyouapp.online www.tankyouapp.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name tankyouapp.online www.tankyouapp.online;

    ssl_certificate /etc/letsencrypt/live/tankyouapp.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tankyouapp.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    location /static/ {
        alias /code/staticfiles/;
    }

    location /media/ {
        alias /code/media/;
    }

    location / {
        proxy_pass http://tankyou_web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
