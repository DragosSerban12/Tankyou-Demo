{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Crear cuenta | TankYou{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card" style="max-width: 520px;">

        <!-- Header -->
        <div class="text-center mb-4">
            <div style="width: 48px; height: 48px; background: rgba(16,185,129,0.1); border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1rem;">
                <i data-lucide="user-plus" style="width:22px;height:22px;color:#10B981;"></i>
            </div>
            <h2>Crear cuenta</h2>
            <p style="color: var(--ty-text-muted); font-size: 0.9rem; margin-bottom: 0;">
                Unete a TankYou y gestiona tus recargas de combustible
            </p>
        </div>

        <form method="post" class="ty-form">
            {% csrf_token %}
            {% crispy form %}
        </form>

        <div class="text-center" style="padding-top: 1rem; border-top: 1px solid var(--ty-border);">
            <p style="color: var(--ty-text-muted); font-size: 0.85rem; margin-bottom: 0.5rem;">
                Ya tienes cuenta?
            </p>
            <a href="{% url 'account_login' %}" class="btn btn-ty-outline btn-sm">
                Iniciar sesion
            </a>
        </div>

    </div>
</div>
{% endblock %}
