{% extends "base.html" %}

{% block title %}Eliminar vehiculo | TankYou{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 50vh;">
    <div class="confirm-delete-card">
        <div class="confirm-delete-header d-flex align-items-center gap-2">
            <i data-lucide="alert-triangle" style="width:18px;height:18px;"></i>
            Confirmar eliminacion
        </div>
        <div class="confirm-delete-body">
            <p style="font-size: 1.05rem; margin-bottom: 0.5rem;">
                Estas seguro de querer eliminar este vehiculo?
            </p>
            <p style="color: var(--ty-text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">
                <strong>{{ object }}</strong><br>
                Esta accion no se puede deshacer.
            </p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'vehicles' %}" class="btn btn-ty-outline">
                        Cancelar
                    </a>
                    <button type="submit" class="btn" style="background: var(--ty-danger); color: #FFFFFF; border-radius: 10px; padding: 10px 22px; font-weight: 600;">
                        Si, eliminar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
