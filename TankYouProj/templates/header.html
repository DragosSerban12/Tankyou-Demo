<header class="main-header py-3">
    <div class="container d-flex justify-content-between align-items-center">

        <!-- LOGO -->
        <div class="d-flex align-items-center gap-4">
            <a href="{% url 'Home' %}" class="logo text-decoration-none d-flex align-items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #F59E0B;"><path d="M3 22a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2l2-3h6l2 3h2a2 2 0 0 1 2 2v4"/><path d="M14 14c0 1.5-.5 2.5-1.5 3.5L14 19h-4l1.5-1.5C10.5 16.5 10 15.5 10 14a4 4 0 0 1 8 0c0 1.5-.5 2.5-1.5 3.5L18 19h-4"/><path d="m15 11 1 6"/><path d="m19 11-1 6"/></svg>
                TankYou
            </a>

            {% if user.is_authenticated %}
            <nav class="nav-pills-custom d-none d-md-flex">
                <a href="{% url 'Home' %}">Inicio</a>
                <a href="{% url 'vehicles' %}">Vehiculos</a>
                <a href="{% url 'orders' %}">Pedidos</a>
                <a href="{% url 'payments' %}">Pagos</a>
                <a href="{% url 'notifications' %}">Notificaciones</a>
            </nav>
            {% endif %}
        </div>

        <!-- AUTH -->
        <div class="d-flex align-items-center gap-3">
            {% if user.is_authenticated %}
                <span class="header-user-greeting d-none d-md-inline">
                    Hola, <strong>{{ user.nombre }}</strong>
                </span>

                <form method="post" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        <i data-lucide="log-out" style="width:14px;height:14px;"></i>
                        <span class="d-none d-md-inline ms-1">Salir</span>
                    </button>
                </form>
            {% else %}
                <a href="{% url 'account_login' %}" class="btn btn-outline-light btn-sm">
                    Iniciar sesion
                </a>
                <a href="{% url 'usuario_crear' %}" class="btn btn-accent btn-sm">
                    Registrarse
                </a>
            {% endif %}
        </div>

    </div>
</header>
